  <div id="login" class="login">

    <div class="orb orb-b" aria-hidden="true"></div>

      <img class="logo-hero drop-in" src="/static/logo.png" alt="KDFINSCHOOL" />
      <div class="login-word">
        <h2><span>KAVACH</span></h2>

    <div class="lock-letterbox lb-bot" aria-hidden="true"></div>
    <div class="lock-vignette"></div>

    <div class="lock-embers" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="lock-stage">
      <div class="lock-wrap">
        <svg class="svg-lock" viewBox="0 0 160 210" aria-hidden="true">
          <defs>
            <linearGradient id="lockBody" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#C9BDF7"/>
              <stop offset="100%" stop-color="#8B7CF6"/>
            </linearGradient>
            <linearGradient id="lockShine" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#7C6AE8" stop-opacity="0"/>

        <span class="melt-pool"></span>
      </div>
      <svg class="svg-fire" viewBox="0 0 200 320" aria-hidden="true">
        <defs>
          <linearGradient id="flameOuter" x1="0.5" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#FFE7A3"/>
            <stop offset="18%" stop-color="#FFB347"/>
            <stop offset="48%" stop-color="#FF4A12"/>
            <stop offset="78%" stop-color="#B01408"/>

            <stop offset="100%" stop-color="#FF3B00" stop-opacity="0"/>

          <filter id="flameBlur" x="-40%" y="-10%" width="180%" height="130%">

      <div class="dragon-wrap" aria-hidden="true">

              <stop offset="0%" stop-color="#5A1A28"/>
              <stop offset="45%" stop-color="#2A0C16"/>
              <stop offset="100%" stop-color="#12060A"/>
            </linearGradient>
            <linearGradient id="dragWing" x1="0" y1="0" x2="0.2" y2="1">
              <stop offset="0%" stop-color="#E05A78"/>
              <stop offset="40%" stop-color="#8A243C"/>
              <stop offset="100%" stop-color="#2A0810"/>

            <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFE7A3"/>

            <path fill="none" stroke="#1A080C" stroke-width="3" d="M410 98 L650 118"/>
            <path fill="#1A080C" d="M764 64 L792 58 L772 86 Z"/>
          </g>
          <path fill="url(#dragScale)" d="M372 70 C364 40 378 16 400 14 C422 16 436 40 428 70 C422 92 410 118 400 126 C390 118 378 92 372 70 Z"/>
          <path fill="#1A080C" d="M378 28 L358 0 L392 26 Z"/>

      <div class="brand">
        <img class="logo-side" src="/static/logo.png" alt="KDFINSCHOOL" />
        <div class="brand-copy">
          <h2><span>KAVACH</span></h2>
          <small>KDFINSCHOOL</small>

      </div>
      <button class="nav on" data-go="home" type="button">HOME</button>
      <button class="nav" data-go="deploy" type="button">DEPLOY BATMAN 2.0</button>
            <button class="nav" data-go="ato" type="button">ATO MANAGER</button>

      <button class="nav" data-go="register" type="button">REGISTER BATMAN</button>

      <button class="nav" id="logoutBtn" type="button">STAND DOWN</button>

    <div class="main">
      <div class="top">
        <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sideNav">
          <img class="logo-top" src="/static/logo.png" alt="KAVACH" />
        </button>
        <div class="top-brand">
          <img class="logo-top" src="/static/logo.png" alt="" />
          <div class="top-go"><span>KAVACH</span></div>
        </div>
        <div class="top-choppy">
          <label class="toggle rg" title="Pause or resume the algo">
            <input id="runToggle" type="checkbox" />
            <span class="knob"></span>
            <span class="tog-copy"><span class="tog-name">ALGO</span><span id="runLbl">KAVACH PAUSED</span></span>
          </label>
          <label class="toggle rg" title="30% dynamic hedge">
            <input id="hedgeToggle" type="checkbox" />
            <span class="knob"></span>
            <span class="tog-copy"><span class="tog-name">HEDGE</span><span id="hedgeLbl">HEDGE OFF</span></span>
          </label>
          <div class="top-exit-box toggle rg exit-sl" title="Stop loss floor — day PnL ≤ level">
            <input id="safeExitLevel" class="top-exit-inp" type="number" step="1" placeholder="₹" aria-label="Stop loss level" />
            <label class="exit-switch">
              <input id="safeExitOn" type="checkbox" />
              <span class="knob"></span>
            </label>
            <span class="tog-copy"><span class="tog-name">STOP LOSS</span><span id="safeExitLbl">STOP LOSS OFF</span></span>
          </div>
          <div class="top-exit-box toggle rg exit-tp" title="Target ceiling — day PnL ≥ level">
            <input id="tpExitLevel" class="top-exit-inp" type="number" step="1" placeholder="₹" aria-label="Target level" />
            <label class="exit-switch">
              <input id="tpExitOn" type="checkbox" />
              <span class="knob"></span>
            </label>
            <span class="tog-copy"><span class="tog-name">TARGET</span><span id="tpExitLbl">TARGET OFF</span></span>
          </div>
        </div>
        <div class="grow"></div>
        <div class="top-spot">
          <div class="chip chip-spot chip-spot-stack" id="spotStack">
            <span id="niftyTop">NIFTY —</span>
            <span id="clock">—</span>
          </div>
        </div>
      </div>
      <div class="top-alert-row" id="topAlertRow">
        <div id="atoBanner" class="ato-banner hidden" role="alert"></div>
        <span id="navPerf" class="nav-perf hidden" aria-live="polite"></span>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
      <div class="body" id="view"></div>
      <div id="goNotice" class="go-notice hidden"></div>
    </div>
  </div>
  
  <nav class="tabbar" id="tabs">
